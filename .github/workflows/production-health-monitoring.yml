name: Production Reliability Health Monitor

on:
  schedule:
    # Runs every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to monitor'
        required: false
        default: 'https://code.ladestack.in'
        type: string

permissions:
  contents: read

concurrency:
  group: production-health-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    name: Production Health & WebContainer Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Production Health Check
        env:
          TARGET_URL: ${{ inputs.target_url || 'https://code.ladestack.in' }}
        run: node scripts/production-health-monitor.mjs "$TARGET_URL"

      - name: Upload Health Check Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health-diagnostics
          path: diagnostics/
          retention-days: 30
