  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#1e1e1e" />
</head>

<body>
  <div id="root"></div>

  <!-- Loading screen (removed after React mounts) -->
  <div id="loading"
    style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1e1e1e;z-index:9999;transition:opacity .4s">
    <div style="text-align:center;color:#fff">
      <div
        style="width:40px;height:40px;border:3px solid #333;border-top-color:#60a5fa;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px">
      </div>
      <p style="font-family:system-ui,sans-serif;font-size:14px;color:#999">Loading GB Coder...</p>
    </div>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>

  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Remove loading screen once React root renders
    var _checkRoot = setInterval(function () {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        clearInterval(_checkRoot);
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(function () { loading.remove(); }, 400);
        }
      }
    }, 50);
    // Fallback: remove after 5s no matter what
    setTimeout(function () {
      clearInterval(_checkRoot);
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function () { loading.remove(); }, 400);
      }
    }, 5000);
  </script>
</body>

</html>
