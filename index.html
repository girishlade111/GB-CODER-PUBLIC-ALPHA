<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="color-scheme" content="light dark" />

  <title>GB Coder - AI-Powered HTML, CSS & JavaScript Code Playground</title>
  <meta name="description"
    content="Free AI-powered online code editor for HTML, CSS & JavaScript with live preview, intelligent code suggestions, and real-time debugging. No signup required." />
  <meta name="keywords"
    content="online code editor, HTML editor, CSS editor, JavaScript editor, AI code editor, code playground, web development IDE, free code editor, browser IDE, live code preview, AI code suggestions, JavaScript compiler, frontend development, code formatter, web development sandbox, TypeScript editor, React playground, code learning platform, responsive design preview, Monaco editor" />
  <meta name="author" content="Girish Lade" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GB Coder - AI-Powered Online Code Editor" />
  <meta property="og:description"
    content="Free AI-powered online code editor for HTML, CSS & JavaScript with live preview, intelligent code suggestions, and real-time debugging." />
  <meta property="og:url" content="https://code.ladestack.in" />
  <meta property="og:site_name" content="GB Coder" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GB Coder - AI-Powered Online Code Editor" />
  <meta name="twitter:description"
    content="Free AI-powered code editor with live preview and AI suggestions. No signup required." />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>

  <!-- Loading screen (removed after React mounts) -->
  <div id="loading" class="gb-loader-root">
    <div class="gb-loader-backdrop"></div>
    <div class="gb-loader-container">
      <!-- Artistic Orbital Tech Emblem -->
      <div class="gb-loader-emblem">
        <!-- Outer Glowing Shimmer Ring -->
        <div class="gb-ring-outer"></div>
        <!-- Middle Dashed Tech Orbit -->
        <div class="gb-ring-middle"></div>
        <!-- Inner Radiant Glass Chamber -->
        <div class="gb-core">
          <div class="gb-core-glow"></div>
          <!-- Stylized Code Bracket Matrix Icon -->
          <svg class="gb-core-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
            <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
          </svg>
        </div>
      </div>

      <!-- Brand Wordmark & Badge -->
      <div class="gb-brand-line">
        <span class="gb-brand-lead">LadeStack</span>
        <span class="gb-brand-divider">/</span>
        <span class="gb-brand-title">GB Coder</span>
        <span class="gb-brand-badge">IDE</span>
      </div>

      <!-- Dynamic High-Tech Progress Beam -->
      <div class="gb-progress-track">
        <div class="gb-progress-beam"></div>
      </div>

      <!-- Monospace Status & Shimmer Dots -->
      <div class="gb-status-line">
        <span class="gb-status-dot"></span>
        <span class="gb-status-text">INITIALIZING WORKSPACE</span>
      </div>
    </div>
  </div>

  <style>
    /* =====================================================================
       GB CODER — MODERN ARTISTIC BOOT LOADER
       ===================================================================== */
    .gb-loader-root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090d;
      z-index: 99999;
      overflow: hidden;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient Spatial Depth Backdrop */
    .gb-loader-backdrop {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.12) 0%, rgba(99, 102, 241, 0.05) 35%, transparent 70%),
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px;
      pointer-events: none;
    }

    .gb-loader-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
      padding: 24px;
    }

    /* Central Emblem Assembly */
    .gb-loader-emblem {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* Outer Radiant Orbit Ring */
    .gb-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #f59e0b;
      border-right-color: rgba(251, 191, 36, 0.65);
      border-bottom-color: rgba(245, 158, 11, 0.15);
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5));
      animation: gb-spin-cw 2.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    /* Middle Counter-Rotating Tech Track */
    .gb-ring-middle {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px dashed rgba(148, 163, 184, 0.35);
      border-left-color: rgba(245, 158, 11, 0.85);
      animation: gb-spin-ccw 4.8s linear infinite;
    }

    /* Inner Glassmorphic Chamber */
    .gb-core {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(26, 29, 41, 0.85) 0%, rgba(11, 13, 19, 0.95) 100%);
      border: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.6),
        0 0 16px rgba(245, 158, 11, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .gb-core-glow {
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, transparent 70%);
      animation: gb-pulse 2.2s ease-in-out infinite;
      z-index: -1;
    }

    .gb-core-icon {
      width: 24px;
      height: 24px;
      color: #fbbf24;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.8));
    }

    /* Brand Wordmark */
    .gb-brand-line {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px;
      line-height: 1;
      letter-spacing: -0.3px;
      margin-bottom: 16px;
    }

    .gb-brand-lead {
      color: #94a3b8;
      font-weight: 500;
    }

    .gb-brand-divider {
      color: #475569;
      font-weight: 300;
    }

    .gb-brand-title {
      font-weight: 700;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.2px;
    }

    .gb-brand-badge {
      display: inline-flex;
      align-items: center;
      padding: 2.5px 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 4px;
      margin-left: 3px;
    }

    /* Progress Track & Luminous Beam */
    .gb-progress-track {
      position: relative;
      width: 190px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .gb-progress-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 70px;
      background: linear-gradient(90deg, transparent 0%, rgba(245, 158, 11, 0.5) 40%, #fbbf24 70%, #ffffff 90%, transparent 100%);
      border-radius: 99px;
      animation: gb-sweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Status Monospace Line */
    .gb-status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 1.8px;
      color: #94a3b8;
      text-transform: uppercase;
      animation: gb-fade 2s ease-in-out infinite;
    }

    .gb-status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }

    /* Keyframe Choreography */
    @keyframes gb-spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes gb-spin-ccw {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes gb-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.92); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }

    @keyframes gb-sweep {
      0% { left: -70px; }
      100% { left: 190px; }
    }

    @keyframes gb-fade {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
  </style>

  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Remove loading screen once React root renders
    var _checkRoot = setInterval(function () {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        clearInterval(_checkRoot);
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          loading.style.transform = 'scale(1.02)';
          loading.style.filter = 'blur(4px)';
          loading.style.pointerEvents = 'none';
          setTimeout(function () { loading.remove(); }, 500);
        }
      }
    }, 50);
    // Fallback: remove after 5s no matter what
    setTimeout(function () {
      clearInterval(_checkRoot);
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transform = 'scale(1.02)';
        loading.style.filter = 'blur(4px)';
        loading.style.pointerEvents = 'none';
        setTimeout(function () { loading.remove(); }, 500);
      }
    }, 5000);
  </script>
</body>

</html>
