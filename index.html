<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="color-scheme" content="light dark" />

  <title>GB Coder - AI-Powered HTML, CSS & JavaScript Code Playground</title>
  <meta name="description"
    content="Free AI-powered online code editor for HTML, CSS & JavaScript with live preview, intelligent code suggestions, and real-time debugging. No signup required." />
  <meta name="keywords"
    content="online code editor, HTML editor, CSS editor, JavaScript editor, AI code editor, code playground, web development IDE, free code editor, browser IDE, live code preview, AI code suggestions, JavaScript compiler, frontend development, code formatter, web development sandbox, TypeScript editor, React playground, code learning platform, responsive design preview, Monaco editor" />
  <meta name="author" content="Girish Lade" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GB Coder - AI-Powered Online Code Editor" />
  <meta property="og:description"
    content="Free AI-powered online code editor for HTML, CSS & JavaScript with live preview, intelligent code suggestions, and real-time debugging." />
  <meta property="og:url" content="https://code.ladestack.in" />
  <meta property="og:site_name" content="GB Coder" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GB Coder - AI-Powered Online Code Editor" />
  <meta name="twitter:description"
    content="Free AI-powered code editor with live preview and AI suggestions. No signup required." />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>

  <!-- Loading screen (removed after React mounts) -->
  <div id="loading" class="gb-loader-root">
    <div class="gb-loader-ambient"></div>
    <div class="gb-loader-card">
      <!-- Official App Logo Emblem -->
      <div class="gb-emblem-frame">
        <img src="/apple-touch-icon.png" alt="GB Coder" width="56" height="56" class="gb-emblem-image" />
      </div>

      <!-- Executive Brand Wordmark & Badge -->
      <div class="gb-brand-row">
        <span class="gb-brand-lead">LadeStack</span>
        <span class="gb-brand-slash">/</span>
        <span class="gb-brand-title">GB Coder</span>
        <span class="gb-brand-badge">IDE</span>
      </div>

      <!-- Linear Enterprise Progress Track -->
      <div class="gb-progress-track">
        <div class="gb-progress-fill"></div>
      </div>

      <!-- Understated Executive Status -->
      <span class="gb-status-caption">Loading workspace…</span>
    </div>
  </div>

  <style>
    /* =====================================================================
       GB CODER — ENTERPRISE-GRADE EXECUTIVE LOADER
       ===================================================================== */
    .gb-loader-root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 99999;
      overflow: hidden;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Soft Luxury Ambient Vignette */
    .gb-loader-ambient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.035) 0%, transparent 65%);
      pointer-events: none;
    }

    .gb-loader-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
    }

    /* Official Brand Logo Emblem Frame */
    .gb-emblem-frame {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0d10;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 16px 36px -4px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 0 24px -2px rgba(255, 255, 255, 0.06);
      margin-bottom: 20px;
      overflow: hidden;
      animation: gb-emblem-pulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .gb-emblem-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 13px;
    }

    /* Brand Wordmark */
    .gb-brand-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1;
      letter-spacing: -0.015em;
      margin-bottom: 18px;
    }

    .gb-brand-lead {
      color: #71717a;
      font-weight: 500;
    }

    .gb-brand-slash {
      color: #3f3f46;
      font-weight: 400;
      font-size: 12px;
    }

    .gb-brand-title {
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.015em;
    }

    .gb-brand-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 5.5px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.06);
      color: #a1a1aa;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      margin-left: 3px;
    }

    /* Enterprise Linear Progress Track (Linear/Stripe Style) */
    .gb-progress-track {
      position: relative;
      width: 130px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .gb-progress-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.4) 30%, #ffffff 70%, rgba(255, 255, 255, 0.4) 100%);
      border-radius: 99px;
      animation: gb-progress-slide 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    /* Understated Executive Caption */
    .gb-status-caption {
      font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      letter-spacing: -0.005em;
      color: #52525b;
      font-weight: 400;
    }

    /* Animations */
    @keyframes gb-emblem-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 
          0 16px 36px -4px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(255, 255, 255, 0.04),
          0 0 20px -2px rgba(255, 255, 255, 0.04);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 
          0 20px 40px -4px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 32px -2px rgba(255, 255, 255, 0.1);
      }
    }

    @keyframes gb-progress-slide {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
  </style>

  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Remove loading screen once React root renders
    var _checkRoot = setInterval(function () {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        clearInterval(_checkRoot);
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          loading.style.transform = 'scale(1.02)';
          loading.style.filter = 'blur(4px)';
          loading.style.pointerEvents = 'none';
          setTimeout(function () { loading.remove(); }, 500);
        }
      }
    }, 50);
    // Fallback: remove after 5s no matter what
    setTimeout(function () {
      clearInterval(_checkRoot);
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transform = 'scale(1.02)';
        loading.style.filter = 'blur(4px)';
        loading.style.pointerEvents = 'none';
        setTimeout(function () { loading.remove(); }, 500);
      }
    }, 5000);
  </script>
</body>

</html>
