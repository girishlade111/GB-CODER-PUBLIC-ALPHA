<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="color-scheme" content="light dark" />

  <title>GB Coder - AI-Powered HTML, CSS & JavaScript Code Playground</title>
  <meta name="description"
    content="Free AI-powered online code editor for HTML, CSS & JavaScript with live preview, intelligent code suggestions, and real-time debugging. No signup required." />
  <meta name="keywords"
    content="online code editor, HTML editor, CSS editor, JavaScript editor, AI code editor, code playground, web development IDE, free code editor, browser IDE, live code preview, AI code suggestions, JavaScript compiler, frontend development, code formatter, web development sandbox, TypeScript editor, React playground, code learning platform, responsive design preview, Monaco editor" />
  <meta name="author" content="Girish Lade" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GB Coder - AI-Powered Online Code Editor" />
  <meta property="og:description"
    content="Free AI-powered online code editor for HTML, CSS & JavaScript with live preview, intelligent code suggestions, and real-time debugging." />
  <meta property="og:url" content="https://code.ladestack.in" />
  <meta property="og:site_name" content="GB Coder" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GB Coder - AI-Powered Online Code Editor" />
  <meta name="twitter:description"
    content="Free AI-powered code editor with live preview and AI suggestions. No signup required." />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Theme Color — DESIGN.md warm cream (dark mode: #0d0d0d via theme toggle) -->
  <meta name="theme-color" content="#f7f7f4" />

  <!-- DESIGN.md type: Inter substitutes CursorGothic, JetBrains Mono for code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>

  <!-- Loading screen (removed after React mounts) -->
  <div id="loading"
    style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f7f4;z-index:9999;transition:opacity .4s">
    <div style="text-align:center;color:#26251e">
      <div
        style="width:36px;height:36px;border:2px solid #e6e5e0;border-top-color:#f54e00;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px">
      </div>
      <p style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#5a5852">Loading GB Coder...
      </p>
    </div>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>

  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Remove loading screen once React root renders
    var _checkRoot = setInterval(function () {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        clearInterval(_checkRoot);
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(function () { loading.remove(); }, 400);
        }
      }
    }, 50);
    // Fallback: remove after 5s no matter what
    setTimeout(function () {
      clearInterval(_checkRoot);
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function () { loading.remove(); }, 400);
      }
    }, 5000);
  </script>
</body>

</html>
